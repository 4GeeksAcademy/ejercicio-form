<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Form </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet"/>
</head>
<body>
  <div class="container form-section">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title mb-4">Payment form </h4>

        <div class="alert alert-custom" role="alert">
          Faltan algunos datos
        </div>

        <form>
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="cardNumber" class="form-label">Numero de Tarjeta #</label>
              <input type="text" class="form-control" id="cardNumber" placeholder="XXXX XXXX XXXX XXXX" />
            </div>
            <div class="col-md-3">
              <label for="cvc" class="form-label">CVC #</label>
              <input type="text" class="form-control" id="cvc" placeholder="000" />
            </div>
            <div class="col-md-3">
              <label for="amount" class="form-label">cantidad</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="text" class="form-control" id="amount" placeholder="1000$" />
              </div>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="firstName" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="firstName" />
            </div>
            <div class="col-md-6">
              <label for="lastName" class="form-label">Apellidos</label>
              <input type="text" class="form-control" id="lastName" />
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="city" class="form-label">Pais</label>
              <input type="text" class="form-control" id="city" />
            </div>
            <div class="col-md-3">
              <label for="state" class="form-label">Ciudad</label>
              <select class="form-select" id="state">
                <option selected>Elige tu ciudad</option>
                <option>Madrid</option>
                <option>Barcelona</option>
                <option>Sevilla</option>
                <option>Pais Vasco</option>
                <option>Murcia</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="postalCode" class="form-label">codigo postal</label>
              <input type="text" class="form-control" id="postalCode" />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Se acepta:</label><br />
            <div class="card-icons d-flex">
              <img src="https://img.icons8.com/color/48/000000/mastercard-logo.png" alt="MasterCard" />
              <img src="https://img.icons8.com/color/48/000000/visa.png" alt="Visa" />
              <img src="https://img.icons8.com/color/48/000000/discover.png" alt="Discover" />
              <img src="https://img.icons8.com/color/48/000000/amex.png" alt="Amex" />
            </div>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Mensaje</label>
            <textarea class="form-control" id="message" rows="3" placeholder="Escribe cualquier duda"></textarea>
          </div>

          <div class="text-end">
            <button type="reset" class="btn btn-secondary">Cancelar</button>
            <button type="submit" class="btn btn-primary">Enviar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
